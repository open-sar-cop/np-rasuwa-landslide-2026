<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gyirong COP</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<style>
:root{--bg:#070b10;--p:#0d141d;--ln:#243044;--tx:#dce6f2;--dim:#8b9bb0;--gold:#d7b15a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Noto Sans SC",sans-serif;overflow:hidden}
.app{display:grid;grid-template-rows:52px 1fr 64px;height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border-bottom:1px solid var(--ln);background:#0d141d}
header b{color:var(--gold);font-size:13px}.tag{font-size:11px;color:#ffb4b4;border:1px solid #6a3030;padding:2px 7px}
.kpi{font-size:12px;color:var(--dim)}.kpi strong{color:#fff}
.lang button,.tabs button,button,input,textarea{background:#162131;color:var(--tx);border:1px solid #2c3d55;border-radius:4px;padding:5px 8px;font-size:12px;cursor:pointer}
.lang,.tabs,.phases{display:flex;gap:4px;flex-wrap:wrap}
.lang button.on,.tabs button.on,.phases button.on{color:var(--gold);border-color:var(--gold);background:#3a2a10}
.main{display:grid;grid-template-columns:300px 1fr 300px;min-height:0}
.col{overflow:auto;background:var(--p)}.left{border-right:1px solid var(--ln)}.right{border-left:1px solid var(--ln);padding:8px}
#map{position:relative;min-width:0}h3{margin:10px 10px 6px;font-size:11px;color:var(--gold)}
.card,.sec{margin:8px 10px;padding:8px;border:1px solid var(--ln);border-radius:6px;background:#0a1119}.right .sec{margin:0 0 8px}
.meta{font-size:11px;color:var(--dim)}.t{font-size:13px;margin:4px 0}
.src.off{background:#1a2a18;color:#8fe0a8;font-size:10px;padding:1px 6px}
label.row,.pt{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0}
.st{font-size:10px;padding:1px 6px}.st.g{background:#143322;color:#7ee0a6}.st.a{background:#32280e;color:#f0c36a}.st.r{background:#3a1515;color:#ff9a9a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.legend{position:absolute;left:10px;bottom:40px;z-index:4;background:rgba(10,16,24,.9);border:1px solid var(--ln);padding:7px 9px;font-size:11px}
footer{border-top:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
input,textarea{width:100%}button.pri{background:#3a2a10;border-color:#8a6a2a;color:var(--gold)}.warn{font-size:11px;color:#ffb4b4}
</style></head><body>
<div class="app">
<header>
<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b>GYIRONG COP</b><span class="tag" id="unofficial"></span><div class="lang" id="langBar"></div></div>
<div class="kpi"></div>
<div class="tabs">
<button class="on" data-tab="ops" data-i="tabOps"></button>
<button data-tab="feed" data-i="tabFeed"></button>
<button data-tab="submit" data-i="tabSubmit"></button>
<button data-tab="x" data-i="tabX"></button>
</div></header>
<div class="main"><div class="col left" id="feedCol"></div><div id="map"><div class="legend" id="legend"></div></div><div class="col right" id="rightCol"></div></div>
<footer><div class="phases">
<button data-ph="recon" class="on" data-i="phaseRecon"></button>
<button data-ph="approach" data-i="phaseApproach"></button>
<button data-ph="search" data-i="phaseSearch"></button>
<button data-ph="withdraw" data-i="phaseWithdraw"></button>
</div><div class="meta" data-i="footerNote"></div></footer></div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script>
const KEY='gyirong-fused-v1',LANG_KEY='gyirong-lang';
let lang=localStorage.getItem(LANG_KEY)||((navigator.language||'zh').slice(0,2));
if(!window.I18N[lang]) lang='zh';
function t(k){return (I18N[lang]&&I18N[lang][k])||I18N.zh[k]||k}
function loc(v){if(v==null)return '';if(typeof v==='string')return v;return v[lang]||v.en||v.zh||Object.values(v)[0]||''}
function applyChrome(){
  document.documentElement.lang=lang;document.title=t('title');
  document.getElementById('unofficial').textContent=t('unofficial');
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i)});
  document.getElementById('legend').innerHTML=`<div>${t('legendOpen')} / ${t('legendLimited')} / ${t('legendClosed')} / ${t('legendBorder')}</div>`;
  const k=(window.GYIRONG_DATA&&GYIRONG_DATA.kpi)||{cn:{},np:{}};
  document.querySelector('.kpi').innerHTML=`CN <strong>${k.cn.dead||3}/${k.cn.missing||558}/${k.cn.rescued||2}</strong> · NP <strong>${k.np.dead||469}/${k.np.missing||977}</strong>`;
  document.getElementById('langBar').innerHTML=LANGS.map(L=>`<button data-lang="${L.id}" class="${L.id===lang?'on':''}">${L.label}</button>`).join('');
  document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem(LANG_KEY,lang);applyChrome();renderFeed();renderRight(curTab);plotNews()});
}
const official=(window.GYIRONG_DATA&&GYIRONG_DATA.published)||[];
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(!s)return {published:official.slice(),pending:[],comments:{}};return {published:official.concat((s.published||[]).filter(p=>p.src==='user')),pending:s.pending||[],comments:s.comments||{}}}catch{return {published:official.slice(),pending:[],comments:{}}}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s))}let state=load(),curTab='ops';
const PT={port:{lng:85.377744,lat:28.279672,z:14.2,pitch:64,bear:22},lake:{lng:85.392,lat:28.293,z:14,pitch:62,bear:-8},town:{lng:85.325,lat:28.390,z:12.7,pitch:52,bear:165},wide:{lng:85.40,lat:28.31,z:11,pitch:50,bear:18}};
const dem=new mlcontour.DemSource({url:'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png',encoding:'terrarium',maxzoom:15,worker:true});dem.setupMaplibre(maplibregl);
const ops={type:'FeatureCollection',features:[
 {type:'Feature',properties:{layer:'path'},geometry:{type:'LineString',coordinates:[[85.505,28.355],[85.40,28.30],[85.3777,28.2797],[85.356,28.248]]}},
 {type:'Feature',properties:{layer:'border'},geometry:{type:'LineString',coordinates:[[85.28,28.22],[85.3777,28.2797],[85.52,28.36]]}},
 {type:'Feature',properties:{layer:'road',status:'limited'},geometry:{type:'LineString',coordinates:[[85.334,28.378],[85.372,28.292]]}},
 {type:'Feature',properties:{layer:'road',status:'closed'},geometry:{type:'LineString',coordinates:[[85.372,28.292],[85.3777,28.2797]]}},
 {type:'Feature',properties:{layer:'lake'},geometry:{type:'Polygon',coordinates:[[[85.386,28.289],[85.399,28.289],[85.401,28.299],[85.387,28.300],[85.386,28.289]]]}}
]};
const map=new maplibregl.Map({container:'map',center:[PT.port.lng,PT.port.lat],zoom:13.1,pitch:58,bearing:16,maxPitch:80,style:{version:8,glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',sources:{sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256},dem:{type:'raster-dem',tiles:[dem.sharedDemProtocolUrl],encoding:'terrarium',tileSize:256,maxzoom:15},contours:{type:'vector',tiles:[dem.contourProtocolUrl({multiplier:1,thresholds:{13:[100,500],14:[50,200]},elevationKey:'ele',levelKey:'level',contourLayer:'contours'})],maxzoom:15},ops:{type:'geojson',data:ops}},layers:[{id:'sat',type:'raster',source:'sat'},{id:'hs',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':0.48}},{id:'lake',type:'fill',source:'ops',filter:['==',['get','layer'],'lake'],paint:{'fill-color':'#1a8aaa','fill-opacity':0.45}},{id:'path',type:'line',source:'ops',filter:['==',['get','layer'],'path'],paint:{'line-color':'#ff7a3d','line-width':3,'line-dasharray':[1.2,1]}},{id:'border',type:'line',source:'ops',filter:['==',['get','layer'],'border'],paint:{'line-color':'#e8eef5','line-width':2.2,'line-dasharray':[3,2]}},{id:'rd-lim',type:'line',source:'ops',filter:['==',['get','status'],'limited'],paint:{'line-color':'#e0a14a','line-width':3.4}},{id:'rd-off',type:'line',source:'ops',filter:['==',['get','status'],'closed'],paint:{'line-color':'#e25757','line-width':3.6}},{id:'c-major',type:'line',source:'contours','source-layer':'contours',filter:['==',['get','level'],1],paint:{'line-color':'rgba(255,214,90,.85)','line-width':1.1}}],terrain:{source:'dem',exaggeration:1.3}}});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-left');
function vis(ids,on){ids.forEach(id=>{if(map.getLayer(id))map.setLayoutProperty(id,'visibility',on?'visible':'none')})}
function renderFeed(){const items=[...state.published].sort((a,b)=>new Date(b.t)-new Date(a.t));document.getElementById('feedCol').innerHTML='<h3>'+t('feed')+'</h3>'+items.map(p=>`<div class="card"><div class="meta"><span class="src off">${t('official')}</span> ${(p.t||'').slice(0,16)}</div><div class="t">${loc(p.title)}</div><div class="meta">${loc(p.body)}</div></div>`).join('')}
function stClass(s){return s==='closed'?'r':(s==='done'||s==='open'?'g':'a')}
function renderRight(tab){curTab=tab;const box=document.getElementById('rightCol');const D=window.GYIRONG_DATA||{};
if(tab==='ops'){const roads=(D.roads||[]).map(r=>`<div class="pt">${loc(r.name)} <span class="st ${stClass(r.status)}">${r.status}</span></div>`).join('');const sites=(D.sites||[]).map(s=>`<div class="pt">${loc(s.name)} <span class="st ${stClass(s.status)}">${s.status}</span></div>`).join('');box.innerHTML=`<h3>${t('layers')}</h3><div class="sec"><label class="row">${t('layer3d')} <input type="checkbox" id="l3d" checked></label><label class="row">${t('layerC')} <input type="checkbox" id="lC" checked></label><label class="row">${t('layerBd')} <input type="checkbox" id="lBd" checked></label><label class="row">${t('layerRd')} <input type="checkbox" id="lRd" checked></label><label class="row">${t('layerLake')} <input type="checkbox" id="lLake" checked></label></div><div class="sec grid2"><button data-fly="port">${t('flyPort')}</button><button data-fly="lake">${t('flyLake')}</button><button data-fly="town">${t('flyTown')}</button><button data-fly="wide">${t('flyWide')}</button></div><h3>${t('roadsForces')}</h3><div class="sec">${roads}${sites}</div><h3>${t('lakeTitle')}</h3><div class="sec meta">${loc((D.hydro||{}).status)}</div>`;document.getElementById('l3d').onchange=e=>{vis(['hs'],e.target.checked);map.setTerrain(e.target.checked?{source:'dem',exaggeration:1.3}:null)};document.getElementById('lC').onchange=e=>vis(['c-major'],e.target.checked);document.getElementById('lBd').onchange=e=>vis(['border'],e.target.checked);document.getElementById('lRd').onchange=e=>vis(['rd-lim','rd-off'],e.target.checked);document.getElementById('lLake').onchange=e=>vis(['lake'],e.target.checked);document.querySelectorAll('[data-fly]').forEach(b=>b.onclick=()=>{const p=PT[b.dataset.fly];map.flyTo({center:[p.lng,p.lat],zoom:p.z,pitch:p.pitch,bearing:p.bear,duration:1200})});return}
if(tab==='submit'){box.innerHTML=`<h3>${t('submitH')}</h3><div class="sec"><p class="warn">${t('submitWarn')}</p><input id="sTitle" placeholder="${t('labelTitle')}"><textarea id="sBody" rows="4"></textarea><button class="pri" id="sGo">${t('submitBtn')}</button></div>`;document.getElementById('sGo').onclick=()=>{const title=sTitle.value.trim(),body=sBody.value.trim();if(!title||!body)return alert(t('needTitle'));const item={id:'u'+Date.now(),src:'user',title:{zh:title,en:title,ne:title,hi:title},body:{zh:body,en:body,ne:body,hi:body},lat:28.28,lng:85.38,geo:'place',t:new Date().toISOString()};state.published.unshift(item);save(state);renderFeed();plotNews()};return}
if(tab==='x'){box.innerHTML='<h3>'+t('xH')+'</h3>'+((window.GYIRONG_DATA.xPosts)||[]).map(p=>`<div class="sec"><div class="meta">${p.user}</div><div class="t">${loc(p.text)}</div></div>`).join('');return}renderFeed()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));renderRight(b.dataset.tab)});
let newsMarks=[];function plotNews(){newsMarks.forEach(m=>m.remove());newsMarks=[];state.published.forEach(p=>{if(p.lat==null||p.geo==='unknown')return;const el=document.createElement('div');el.style.cssText='width:9px;height:9px;border-radius:50%;background:#d7b15a;border:1px solid #111';newsMarks.push(new maplibregl.Marker({element:el}).setLngLat([p.lng,p.lat]).setPopup(new maplibregl.Popup().setHTML(`<b>${loc(p.title)}</b><p>${loc(p.body)}</p>`)).addTo(map))})}
async function pullSnapshot(){try{const r=await fetch('snapshot.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const snap=await r.json();if(snap.items){const ids=new Set(state.published.map(p=>p.id));snap.items.forEach(it=>{if(it.id&&!ids.has(it.id))state.published.push(it)})}if(snap.roads)GYIRONG_DATA.roads=snap.roads;if(snap.sites)GYIRONG_DATA.sites=snap.sites;if(snap.hydro)GYIRONG_DATA.hydro=snap.hydro;if(snap.kpi)GYIRONG_DATA.kpi=snap.kpi;applyChrome();renderFeed();renderRight(curTab);plotNews()}catch(e){}}
map.on('load',plotNews);pullSnapshot();applyChrome();renderFeed();renderRight('ops');
</script></body></html>
