<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>吉隆 / Rasuwa COP</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    :root { --bg:#070b10; --p:#0d141d; --ln:#243044; --tx:#dce6f2; --dim:#8b9bb0; --gold:#d7b15a; --red:#e25757; --gn:#3dbe7a; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--tx); font-family:"Noto Sans SC","PingFang SC",sans-serif; overflow:hidden; }
    .app { display:grid; grid-template-rows:52px 1fr 72px; height:100%; }
    header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 12px; border-bottom:1px solid var(--ln); background:#0d141d; }
    header b { color:var(--gold); font-size:13px; letter-spacing:.08em; }
    .tag { font-size:11px; color:#ffb4b4; border:1px solid #6a3030; padding:2px 7px; }
    .kpi { font-size:12px; color:var(--dim); } .kpi strong { color:#fff; }
    .lang button, .tabs button, button, input, textarea {
      background:#162131; color:var(--tx); border:1px solid #2c3d55; border-radius:4px; padding:5px 8px; font-size:12px; cursor:pointer;
    }
    .lang, .tabs, .phases { display:flex; gap:4px; flex-wrap:wrap; }
    .lang button.on, .tabs button.on, .phases button.on { color:var(--gold); border-color:var(--gold); background:#3a2a10; }
    .main { display:grid; grid-template-columns:300px 1fr 300px; min-height:0; }
    .col { overflow:auto; background:var(--p); }
    .left { border-right:1px solid var(--ln); } .right { border-left:1px solid var(--ln); padding:8px; }
    #map { position:relative; min-width:0; }
    h3 { margin:10px 10px 6px; font-size:11px; letter-spacing:.12em; color:var(--gold); }
    .card, .sec { margin:8px 10px; padding:8px; border:1px solid var(--ln); border-radius:6px; background:#0a1119; }
    .right .sec { margin:0 0 8px; }
    .meta { font-size:11px; color:var(--dim); } .t { font-size:13px; margin:4px 0; }
    .src.off { background:#1a2a18; color:#8fe0a8; font-size:10px; padding:1px 6px; }
    .src.user { background:#2a2410; color:#f0c36a; font-size:10px; padding:1px 6px; }
    label.row, .row, .pt { display:flex; justify-content:space-between; gap:8px; font-size:12px; padding:3px 0; }
    .st { font-size:10px; padding:1px 6px; border-radius:3px; }
    .st.g { background:#143322; color:#7ee0a6; } .st.a { background:#32280e; color:#f0c36a; } .st.r { background:#3a1515; color:#ff9a9a; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .legend { position:absolute; left:10px; bottom:40px; z-index:4; background:rgba(10,16,24,.9); border:1px solid var(--ln); padding:7px 9px; font-size:11px; border-radius:6px; }
    footer { border-top:1px solid var(--ln); display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:#0b1118; }
    input, textarea { width:100%; }
    button.pri { background:#3a2a10; border-color:#8a6a2a; color:var(--gold); }
    .warn { font-size:11px; color:#ffb4b4; }
    .cmt { font-size:12px; border-top:1px solid #1a2430; padding:3px 0; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <b>GYIRONG COP</b>
      <span class="tag" id="unofficial">非官方</span>
      <div class="lang" id="langBar"></div>
    </div>
    <div class="kpi">CN <strong>3 / 558 / 2</strong> · NP <strong>469 / 977</strong> · G216 <strong>800m</strong></div>
    <div class="tabs">
      <button class="on" data-tab="ops">图层</button>
      <button data-tab="feed">动态</button>
      <button data-tab="submit">上报</button>
      <button data-tab="x">X</button>
    </div>
  </header>
  <div class="main">
    <div class="col left" id="feedCol"></div>
    <div id="map"><div class="legend">
      <div>绿 可通行 · 黄 抢通 · 红 封闭 · 白 国境 · 橙 路径</div>
    </div></div>
    <div class="col right" id="rightCol"></div>
  </div>
  <footer>
    <div class="phases">
      <button data-ph="recon" class="on">侦察</button>
      <button data-ph="approach">前突</button>
      <button data-ph="search">搜救</button>
      <button data-ph="withdraw">避险</button>
    </div>
    <div class="meta">一张图：3D地形 + 动态 + 指挥图层。人员点是报道位置。</div>
  </footer>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script>
const KEY='gyirong-fused-v1', LANG_KEY='gyirong-lang';
let lang = localStorage.getItem(LANG_KEY) || ((navigator.language||'zh').slice(0,2));
if (!window.I18N[lang]) lang='zh';
function t(k){ return (I18N[lang]&&I18N[lang][k]) || I18N.zh[k] || k; }
function applyChrome(){
  document.title = t('title');
  document.getElementById('unofficial').textContent = t('unofficial');
  document.getElementById('langBar').innerHTML = LANGS.map(L=>`<button data-lang="${L.id}" class="${L.id===lang?'on':''}">${L.label}</button>`).join('');
  document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; localStorage.setItem(LANG_KEY,lang); applyChrome(); renderFeed(); renderRight(curTab); });
}
const official=(window.GYIRONG_DATA&&GYIRONG_DATA.published)||[];
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(!s) return {published:official.slice(), pending:[], comments:{}};
    return {published:official.concat((s.published||[]).filter(p=>p.src==='user')), pending:s.pending||[], comments:s.comments||{}};
  }catch{ return {published:official.slice(), pending:[], comments:{}}; }
}
function save(s){ localStorage.setItem(KEY, JSON.stringify(s)); }
let state=load(), curTab='ops';
const PT={ port:{lng:85.377744,lat:28.279672,z:14.2,pitch:64,bear:22}, lake:{lng:85.392,lat:28.293,z:14,pitch:62,bear:-8}, town:{lng:85.325,lat:28.390,z:12.7,pitch:52,bear:165}, wide:{lng:85.40,lat:28.31,z:11,pitch:50,bear:18} };
const dem=new mlcontour.DemSource({url:'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png', encoding:'terrarium', maxzoom:15, worker:true});
dem.setupMaplibre(maplibregl);
const ops={type:'FeatureCollection',features:[
  {type:'Feature',properties:{layer:'path'},geometry:{type:'LineString',coordinates:[[85.505,28.355],[85.47,28.34],[85.40,28.30],[85.3777,28.2797],[85.356,28.248]]}},
  {type:'Feature',properties:{layer:'border'},geometry:{type:'LineString',coordinates:[[85.28,28.22],[85.36,28.268],[85.3777,28.2797],[85.43,28.31],[85.52,28.36]]}},
  {type:'Feature',properties:{layer:'road',status:'limited',name:'G216'},geometry:{type:'LineString',coordinates:[[85.334,28.378],[85.372,28.292]]}},
  {type:'Feature',properties:{layer:'road',status:'closed',name:'gate'},geometry:{type:'LineString',coordinates:[[85.372,28.292],[85.3777,28.2797]]}},
  {type:'Feature',properties:{layer:'lake'},geometry:{type:'Polygon',coordinates:[[[85.386,28.289],[85.399,28.289],[85.401,28.299],[85.387,28.300],[85.386,28.289]]]}},
  {type:'Feature',properties:{layer:'sector',fill:'#8a2020'},geometry:{type:'Polygon',coordinates:[[[85.368,28.272],[85.388,28.272],[85.390,28.286],[85.370,28.288],[85.368,28.272]]]}}
]};
const points={type:'FeatureCollection',features:[
  {type:'Feature',properties:{kind:'force',name:'CP'},geometry:{type:'Point',coordinates:[85.325,28.390]}},
  {type:'Feature',properties:{kind:'force',name:'fwd'},geometry:{type:'Point',coordinates:[85.360,28.318]}},
  {type:'Feature',properties:{kind:'obj',name:'port'},geometry:{type:'Point',coordinates:[85.377744,28.279672]}},
  {type:'Feature',properties:{kind:'rescue',name:'2'},geometry:{type:'Point',coordinates:[85.374,28.282]}}
]};
const map=new maplibregl.Map({
  container:'map', center:[PT.port.lng,PT.port.lat], zoom:13.1, pitch:58, bearing:16, maxPitch:80,
  style:{ version:8, glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources:{
      sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256},
      dem:{type:'raster-dem',tiles:[dem.sharedDemProtocolUrl],encoding:'terrarium',tileSize:256,maxzoom:15},
      contours:{type:'vector',tiles:[dem.contourProtocolUrl({multiplier:1,thresholds:{12:[100,500],13:[100,500],14:[50,200]},elevationKey:'ele',levelKey:'level',contourLayer:'contours'})],maxzoom:15},
      ops:{type:'geojson',data:ops}, pts:{type:'geojson',data:points}
    },
    layers:[
      {id:'sat',type:'raster',source:'sat'},
      {id:'hs',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':0.48}},
      {id:'sec',type:'fill',source:'ops',filter:['==',['get','layer'],'sector'],paint:{'fill-color':['get','fill'],'fill-opacity':0.2}},
      {id:'lake',type:'fill',source:'ops',filter:['==',['get','layer'],'lake'],paint:{'fill-color':'#1a8aaa','fill-opacity':0.45}},
      {id:'path',type:'line',source:'ops',filter:['==',['get','layer'],'path'],paint:{'line-color':'#ff7a3d','line-width':3,'line-dasharray':[1.2,1]}},
      {id:'border',type:'line',source:'ops',filter:['==',['get','layer'],'border'],paint:{'line-color':'#e8eef5','line-width':2.2,'line-dasharray':[3,2]}},
      {id:'rd-lim',type:'line',source:'ops',filter:['==',['get','status'],'limited'],paint:{'line-color':'#e0a14a','line-width':3.4}},
      {id:'rd-off',type:'line',source:'ops',filter:['==',['get','status'],'closed'],paint:{'line-color':'#e25757','line-width':3.6}},
      {id:'c-major',type:'line',source:'contours','source-layer':'contours',filter:['==',['get','level'],1],paint:{'line-color':'rgba(255,214,90,.85)','line-width':1.1}},
      {id:'pt-force',type:'circle',source:'pts',filter:['==',['get','kind'],'force'],paint:{'circle-radius':6,'circle-color':'#d7b15a','circle-stroke-width':1}},
      {id:'pt-res',type:'circle',source:'pts',filter:['==',['get','kind'],'rescue'],paint:{'circle-radius':6,'circle-color':'#3dbe7a','circle-stroke-width':1}},
      {id:'pt-obj',type:'circle',source:'pts',filter:['==',['get','kind'],'obj'],paint:{'circle-radius':7,'circle-color':'#e25757','circle-stroke-width':2,'circle-stroke-color':'#fff'}}
    ],
    terrain:{source:'dem',exaggeration:1.3}
  }
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-left');
function vis(ids,on){ ids.forEach(id=>{ if(map.getLayer(id)) map.setLayoutProperty(id,'visibility',on?'visible':'none'); }); }
function renderFeed(){
  const items=[...state.published].sort((a,b)=>new Date(b.t)-new Date(a.t));
  document.getElementById('feedCol').innerHTML='<h3>'+t('feed')+'</h3>'+items.map(p=>{
    const cms=state.comments[p.id]||[];
    return `<div class="card"><div class="meta"><span class="src ${p.src==='official'?'off':'user'}">${p.src==='official'?t('official'):t('userOk')}</span> · ${(p.t||'').slice(0,16).replace('T',' ')}</div>
      <div class="t">${p.title}</div><div class="meta">${p.body||''}</div>
      ${p.link?`<div class="meta"><a href="${p.link}" target="_blank" style="color:#8fd4f0">${t('original')}</a></div>`:''}
      ${cms.map(c=>`<div class="cmt">${c}</div>`).join('')}
      <input data-cmt="${p.id}" placeholder="${t('commentPh')}"></div>`;
  }).join('');
  document.querySelectorAll('[data-cmt]').forEach(inp=>{
    inp.onkeydown=e=>{ if(e.key!=='Enter'||!inp.value.trim())return; state.comments[inp.dataset.cmt]=state.comments[inp.dataset.cmt]||[]; state.comments[inp.dataset.cmt].push(inp.value.trim()); save(state); renderFeed(); };
  });
}
function renderRight(tab){
  curTab=tab; const box=document.getElementById('rightCol');
  if(tab==='ops'){
    box.innerHTML=`<h3>图层</h3><div class="sec">
      <label class="row">3D <input type="checkbox" id="l3d" checked></label>
      <label class="row">等高线 <input type="checkbox" id="lC" checked></label>
      <label class="row">国境 <input type="checkbox" id="lBd" checked></label>
      <label class="row">道路 <input type="checkbox" id="lRd" checked></label>
      <label class="row">堰塞湖 <input type="checkbox" id="lLake" checked></label>
      <label class="row">路径 <input type="checkbox" id="lPath" checked></label></div>
    <h3>镜头</h3><div class="sec grid2">
      <button data-fly="port">国门</button><button data-fly="lake">堰塞湖</button>
      <button data-fly="town">吉隆镇</button><button data-fly="wide">全图</button></div>
    <h3>道路 / 兵力</h3><div class="sec">
      <div class="pt">国门 <span class="st r">封闭</span></div>
      <div class="pt">G216 <span class="st a">800m</span></div>
      <div class="pt">消防 681 <span class="st a">吉隆镇</span></div>
      <div class="pt">前突 17 <span class="st a">5km</span></div>
      <div class="pt">热索村 2 <span class="st g">已救</span></div></div>
    <h3>堰塞湖</h3><div class="sec meta">上游约2.5km · 150–200万m³ · 已漫溢</div>`;
    document.getElementById('l3d').onchange=e=>{ vis(['hs'],e.target.checked); map.setTerrain(e.target.checked?{source:'dem',exaggeration:1.3}:null); };
    document.getElementById('lC').onchange=e=>vis(['c-major'],e.target.checked);
    document.getElementById('lBd').onchange=e=>vis(['border'],e.target.checked);
    document.getElementById('lRd').onchange=e=>vis(['rd-lim','rd-off'],e.target.checked);
    document.getElementById('lLake').onchange=e=>vis(['lake'],e.target.checked);
    document.getElementById('lPath').onchange=e=>vis(['path'],e.target.checked);
    document.querySelectorAll('[data-fly]').forEach(b=>b.onclick=()=>{ const p=PT[b.dataset.fly]; map.flyTo({center:[p.lng,p.lat],zoom:p.z,pitch:p.pitch,bearing:p.bear,duration:1200}); });
    return;
  }
  if(tab==='submit'){
    box.innerHTML=`<h3>${t('submitH')}</h3><div class="sec"><p class="warn">${t('submitWarn')}</p>
      <input id="sTitle" placeholder="${t('labelTitle')}" style="margin:6px 0">
      <textarea id="sBody" rows="4"></textarea>
      <div class="grid2" style="margin-top:6px"><input id="sLat" placeholder="28.28"><input id="sLng" placeholder="85.38"></div>
      <button class="pri" id="sGo" style="margin-top:8px;width:100%">${t('submitBtn')}</button></div>`;
    document.getElementById('sGo').onclick=()=>{
      const title=sTitle.value.trim(), body=sBody.value.trim(); if(!title||!body) return alert(t('needTitle'));
      const lat=parseFloat(sLat.value)||28.28, lng=parseFloat(sLng.value)||85.38;
      const item={id:'u'+Date.now(),src:'user',title,body,lat,lng,t:new Date().toISOString()};
      state.pending.unshift(item); state.published.unshift(item); save(state); renderFeed(); alert(t('queued'));
    }; return;
  }
  if(tab==='x'){
    const d=window.GYIRONG_DATA||{xPosts:[]};
    box.innerHTML='<h3>'+t('xH')+'</h3>'+(d.xPosts||[]).map(p=>`<div class="sec"><div class="meta">${p.user}</div><div class="t">${p.text}</div></div>`).join('');
    return;
  }
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b)); renderRight(b.dataset.tab); });
document.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>{ document.querySelectorAll('[data-ph]').forEach(x=>x.classList.toggle('on',x===b)); });
applyChrome(); renderFeed(); renderRight('ops');
</script>
</body>
</html>
