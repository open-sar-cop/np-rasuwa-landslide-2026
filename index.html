    var gv = max * g / 4;
    svg += '<line x1="' + L + '" y1="' + y(gv) + '" x2="' + (W - R) + '" y2="' + y(gv) + '" stroke="#e5e7eb" stroke-width="1"/>' +
      '<text x="' + (L - 6) + '" y="' + (y(gv) + 4) + '" font-size="10" fill="#9ca3af" text-anchor="end">' + gv + "</text>";
  }
  function line(key, color) {
    var pts = [], dots = "";
    series.forEach(function (p, i) {
      if (p[key] == null) return;
      pts.push(x(i) + "," + y(p[key]));
      dots += '<circle cx="' + x(i) + '" cy="' + y(p[key]) + '" r="3.5" fill="' + color + '">' +
        "<title>" + esc(p.label) + "：" + p[key] + "人</title></circle>";
    });
    if (pts.length < 2) return dots;
    return '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + color + '" stroke-width="2.2"/>' + dots;
  }
  svg += line("missing", "#d97706") + line("dead", "#dc2626");
  series.forEach(function (p, i) {
    svg += '<text x="' + x(i) + '" y="' + (H - 8) + '" font-size="10" fill="#6b7280" text-anchor="middle">' + esc(p.label) + "</text>";
  });
  svg += '<rect x="' + (W - 118) + '" y="2" width="12" height="3.5" fill="#dc2626"/><text x="' + (W - 100) + '" y="8" font-size="10.5" fill="#374151">遇难</text>' +
    '<rect x="' + (W - 62) + '" y="2" width="12" height="3.5" fill="#d97706"/><text x="' + (W - 44) + '" y="8" font-size="10.5" fill="#374151">失联</text>';
  svg += "</svg>";
  document.getElementById("chart").innerHTML = svg;
})();

/* ---------- Timeline ---------- */
document.getElementById("timeline").innerHTML = (COP.updates || []).map(function (u) {
  return '<div class="tl-item"><span class="tl-time">' + esc(u.time) + "</span>" +
    (u.tag ? '<span class="tl-tag">' + esc(u.tag) + "</span>" : "") +
    '<div class="tl-text">' + esc(u.text) + "</div></div>";
}).join("");

/* ---------- Resources ---------- */
document.getElementById("resources").innerHTML = (COP.resources || []).map(function (r) {
  return '<div class="res-item"><span class="res-name">' + esc(r.name) + "</span>" +
    (r.type ? '<span class="res-type">' + esc(r.type) + "</span>" : "") +
    "<div class='res-detail'>" +
    (r.tasks ? "任务：" + esc(r.tasks) + "；" : "") +
    (r.strength ? "规模：" + esc(r.strength) + "；" : "") +
    (r.base ? "基地：" + esc(r.base) : "") + "</div></div>";
}).join("") || "<div style='padding:10px 16px;color:#6b7280'>暂无记录</div>";

/* ---------- Sources ---------- */
document.getElementById("sources").innerHTML = (COP.sources || []).map(function (s) {
  var name = s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + "</a>" : esc(s.name);
  return "<li>" + name + (s.date ? "（" + esc(s.date) + "）" : "") + "</li>";
}).join("");

document.getElementById("gen-time").textContent = new Date().toLocaleString("zh-CN");

/* ---------- Map ---------- */
var map = L.map("map", { scrollWheelZoom: true }).setView([27.95, 85.0], 8);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 17,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 贡献者'
}).addTo(map);

var layers = {};
var allBounds = [];

if (COP.corridor && COP.corridor.coords && COP.corridor.coords.length) {
  var corr = L.polyline(COP.corridor.coords, {
    color: "#dc2626", weight: 4, opacity: .75, dashArray: "10 8"
  }).addTo(map).bindPopup("<b>" + esc(COP.corridor.name) + "</b><br>" + esc(COP.corridor.note || ""));
  layers.__corridor = { layer: L.layerGroup([corr]).addTo(map), label: "风险廊道", color: "#dc2626" };
  allBounds.push(corr.getBounds());
}

Object.keys(CATS).forEach(function (key) {
  var group = L.layerGroup();
  (COP.sites || []).forEach(function (s) {
    if (s.category !== key) return;
    var cat = CATS[key];
    var m = L.circleMarker([s.lat, s.lon], {
      radius: key === "incident" ? 12 : 8,
      color: "#fff", weight: 2, fillColor: cat.color, fillOpacity: key === "incident" ? .55 : .9
    }).addTo(group);
    m.bindPopup(
      '<div class="pop-name">' + esc(s.name) + "</div>" +
      '<span class="pop-cat" style="background:' + cat.color + '">' + cat.label + "</span><br>" +
      esc(s.description || "") +
      (s.as_of ? '<br><span style="color:#6b7280;font-size:11px">信息截至 ' + esc(s.as_of) + "</span>" : "")
    );
    allBounds.push(L.latLngBounds([s.lat, s.lon], [s.lat, s.lon]));
  });
  if (key === "incident") {
    (COP.sites || []).filter(function (s) { return s.category === "incident"; }).forEach(function (s) {
      L.circle([s.lat, s.lon], { radius: 8000, color: "#dc2626", weight: 1, fillOpacity: .08 }).addTo(group);
    });
  }
  if (group.getLayers().length) {
    group.addTo(map);
    layers[key] = { layer: group, label: CATS[key].label, color: CATS[key].color };
  }
});

if (allBounds.length) { map.fitBounds(L.latLngBounds(allBounds).pad(0.25)); }

/* ---------- Legend & layer toggles ---------- */
var legend = L.control({ position: "bottomright" });
legend.onAdd = function () {
  var div = L.DomUtil.create("div", "legend");
  var html = "<b style='font-size:11px'>图层</b>";
  Object.keys(layers).forEach(function (key) {
    var it = layers[key];
    html += '<div class="row" data-key="' + key + '"><span class="dot" style="background:' + it.color + '"></span>' + esc(it.label) + "</div>";
  });
  div.innerHTML = html;
  L.DomEvent.disableClickPropagation(div);
  return div;
};
legend.addTo(map);
map.whenReady(function () {
  document.querySelectorAll(".legend .row").forEach(function (row) {
    row.addEventListener("click", function () {
      var it = layers[row.dataset.key];
      if (map.hasLayer(it.layer)) { map.removeLayer(it.layer); row.classList.add("off"); }
      else { map.addLayer(it.layer); row.classList.remove("off"); }
    });
  });
});
</script>
</body>
</html>
